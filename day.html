<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日详细 · 个人台账</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1 class="pagetitle">个人台账</h1>
<nav class="nav"><a href="index.html" class="">首页</a><a href="compare.html" class="">产品对比</a><a href="transactions.html" class="">交易记录</a></nav>

<div class="card">
<div class="row"><h2 id="dayTitle">每日详细</h2><span><a href="index.html">回首页</a></span></div>
<div id="dayDetail">正在加载…</div>
</div>

</div>
<script src="common.js"></script>
<script>

loadData().then(()=>{
  const ds=new URLSearchParams(location.search).get('date')||'2026-10-23';
  document.getElementById('dayTitle').textContent='收益明细 · '+ds;
  const {cal, det}=lotCalendar();
  const rows=det[ds];
  const box=document.getElementById('dayDetail');
  if(!rows){ box.innerHTML='<p class="muted">这一天目前8只没有净值收益。</p>'; return; }
  const oldv=OLD_CAL[ds];
  let totAmt=rows.reduce((a,r)=>a+r.shares*r.nav,0);
  let h='<h4 style="margin:12px 0 6px">'+ds+' · 当前8只合计 '+fmt(cal[ds])+' · 当日持有金额合计 '+totAmt.toLocaleString(undefined,{maximumFractionDigits:2})+'</h4>';
  ['网商银行','微众稳健'].forEach(g=>{
    const gr=rows.filter(r=>r.distributor===g);
    if(!gr.length) return;
    const gGain=gr.reduce((a,r)=>a+r.gain,0); const gAmt=gr.reduce((a,r)=>a+r.shares*r.nav,0); const gWan=gAmt?gGain/gAmt*10000:0;
    h+='<div class="groupHead"><span>'+g+'('+gr.length+')</span><span style="color:#e60012">'+fmt(gGain)+' 万收('+fmt(gWan)+')</span></div>';
    h+='<table><tr><th>产品</th><th>当日份额</th><th>上一净值日</th><th>上一净值</th><th>当日净值</th><th>当日金额</th><th>当日收益</th></tr>';
    gr.forEach(r=>{
      h+='<tr><td>'+r.name+'</td><td>'+r.shares.toLocaleString()+'</td><td>'+r.prevDate+'</td><td>'+r.prev+'</td><td>'+r.nav+'</td><td>'+(r.shares*r.nav).toLocaleString(undefined,{maximumFractionDigits:2})+'</td><td>'+fmt(r.gain)+'</td></tr>';
    });
    h+='</table>';
  });
  box.innerHTML=h;
});

</script>
</body>
</html>
