<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人台账</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f5f7;color:#222}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:20px}
main{max-width:720px;margin:0 auto;padding:0 12px 24px}
.total{font-size:30px;font-weight:800;color:#e60012}
.sub{color:#666;font-size:14px;margin-top:4px}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0}
.group{font-weight:700;margin:16px 0 6px}
.prod{border-top:1px solid #eee;padding:10px 0;cursor:pointer}
.prod:first-child{border-top:none}
.row{display:flex;justify-content:space-between;gap:8px}
.muted{color:#888;font-size:13px}
.detail{display:none;margin-top:10px;border-top:1px dashed #ddd;padding-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eee;padding:5px;text-align:left}
canvas{width:100%;height:110px;background:#fafbfc;border:1px solid #eee;border-radius:8px}
input,select,button{padding:7px;margin:4px 4px 4px 0}button{cursor:pointer}
a{color:#2563eb}
</style>
</head>
<body>
<header>
<h1>个人台账</h1>
<div class="total" id="totalHolding">—</div>
<div class="sub" id="todayLine">—</div>
<div class="sub" id="earlyLine">提前披露：2026-10-26 匠心灵动 +17.17，总额 1,457,658.04（中国理财网暂未披露该日净值）</div>
</header>
<main>
<div id="holdings">正在加载…</div>
<div class="card">
<details>
<summary>新增一日净值 / 导出</summary>
<label>产品 <select id="pSel"></select></label>
<label>日期 <input id="dIn" type="date" value="2026-10-27"></label>
<label>净值 <input id="nIn" type="number" step="0.000001" placeholder="1.0190"></label>
<button id="addBtn">加入并重算</button>
<button id="expBtn">导出 JSON</button>
<p id="addMsg" class="muted"></p>
</details>
</div>
<div id="list"></div>
<p class="muted">净值来源：中国理财网公开查询，最新净值日 2026-10-23（提前披露除外）。持仓为自填记录，以银行 App / 对账单为准。过往业绩不代表未来表现。</p>
</main>
<script>
let DATA=null, HOLD=null;
async function load(){
  DATA=await (await fetch('nav-history.json')).json();
  HOLD=await (await fetch('holdings.json')).json();
  document.getElementById('totalHolding').textContent=HOLD.total_holding.toLocaleString()+' 元';
  document.getElementById('todayLine').textContent='今日 +'+HOLD.total_daily_pnl+' · 本月 +'+HOLD.monthly.pnl+' · 2026-10-23';
  const sel=document.getElementById('pSel');
  DATA.products.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.ledger_name;sel.appendChild(o);});
  renderHoldings(); render();
}
function wan(n,prev){ return prev==null?'—':((n-prev)*10000).toFixed(2); }
function chg(n,prev){ return prev==null?'—':((n-prev)/prev*100).toFixed(2)+'%'; }
function draw(canvas, hist){
  const ctx=canvas.getContext('2d'); const W=canvas.width=canvas.offsetWidth*2, H=canvas.height=220;
  ctx.clearRect(0,0,W,H); const vals=hist.map(x=>x[1]).slice().reverse();
  const mn=Math.min(...vals), mx=Math.max(...vals), pad=16;
  ctx.strokeStyle='#5b5bd6'; ctx.lineWidth=3; ctx.beginPath();
  vals.forEach((v,i)=>{const x=pad+i*(W-2*pad)/Math.max(1,vals.length-1); const y=H-pad-(v-mn)/Math.max(0.000001,mx-mn)*(H-2*pad); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
}
function renderHoldings(){
  const wrap=document.getElementById('holdings'); let html='';
  HOLD.groups.forEach(g=>{
    html+='<div class="group">'+g.name+' · 当日 +'+g.daily_pnl+'</div>';
    HOLD.products.filter(p=>p.group===g.name).forEach(p=>{
      const nav=DATA.products.find(n=>n.share_code===p.share_code);
      html+='<div class="card prod" data-share="'+p.share_code+'"><div class="row"><b>'+p.ledger_name+'</b><span>'+p.holding_amount.toLocaleString()+'</span></div>'
        +'<div class="row muted"><span>当日 '+(p.daily_pnl>=0?'+':'')+p.daily_pnl+' · 年化 '+p.annualized+'%</span><span>净值 '+(nav?nav.history_desc[0][1]:'—')+'</span></div></div>';
    });
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll('.prod').forEach(el=>{
    el.onclick=()=>{
      const target=[...document.querySelectorAll('#list .card')].find(c=>c.dataset.share===el.dataset.share);
      if(target){ target.scrollIntoView({behavior:'smooth'}); target.querySelector('.detail').style.display='block'; const p=DATA.products.find(n=>n.share_code===el.dataset.share); draw(target.querySelector('canvas'), p.history_desc); }
    };
  });
}
function render(){
  const wrap=document.getElementById('list'); wrap.innerHTML='';
  DATA.products.forEach(p=>{
    const hist=p.history_desc, latest=hist[0], link='https://xinxipilu.chinawealth.com.cn/queryMenu/prodType/prodTypeDetail?prodRegCode='+p.registration_code;
    const el=document.createElement('div'); el.className='card'; el.dataset.share=p.share_code;
    el.innerHTML='<h3 style="margin:0">'+p.ledger_name+' · '+latest[1]+'</h3><div class="muted">'+p.manager+' · '+p.registration_code+' / '+p.share_code+' · <a href="'+link+'" target="_blank" rel="noopener">中国理财网详情</a></div>'
      +'<div class="detail"><canvas></canvas><table><tr><th>日期</th><th>净值</th><th>日涨跌</th><th>万收</th></tr>'
      +hist.map((row,i)=>{const prev=hist[i+1]?hist[i+1][1]:null; return '<tr><td>'+row[0]+'</td><td>'+row[1]+'</td><td>'+chg(row[1],prev)+'</td><td>'+wan(row[1],prev)+'</td></tr>';}).join('')+'</table></div>';
    el.querySelector('h3').onclick=()=>{const d=el.querySelector('.detail'); d.style.display=d.style.display==='block'?'none':'block'; if(d.style.display==='block') draw(el.querySelector('canvas'), hist);};
    wrap.appendChild(el);
  });
}
document.getElementById('addBtn').onclick=()=>{
  const i=+document.getElementById('pSel').value, d=document.getElementById('dIn').value, n=parseFloat(document.getElementById('nIn').value);
  if(!d||isNaN(n)){document.getElementById('addMsg').textContent='请填写日期和净值';return;}
  const p=DATA.products[i]; p.history_desc=p.history_desc.filter(x=>x[0]!==d); p.history_desc.unshift([d,n]); p.history_desc.sort((a,b)=>b[0].localeCompare(a[0]));
  document.getElementById('addMsg').textContent='已加入 '+p.ledger_name+' '+d+' '+n+'，刷新后恢复仓库数据。'; render();
};
document.getElementById('expBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nav-history.json'; a.click();
};
load();
</script>
</body>
</html>
